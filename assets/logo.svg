<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8" />
      <stop offset="30%" stop-color="#e8b931" />
      <stop offset="60%" stop-color="#c48a18" />
      <stop offset="85%" stop-color="#fced9d" />
      <stop offset="100%" stop-color="#9a6507" />
    </linearGradient>
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fedb72" />
      <stop offset="100%" stop-color="#c28b12" />
    </linearGradient>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff8db" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Crown + M Icon Group -->
  <g transform="translate(15, 12)" filter="url(#dropShadow)">
    <!-- Crown -->
    <path d="M 12 42 L 20 22 C 20 20 23 20 23 22 L 32 38 L 47 10 C 48 8 52 8 53 10 L 68 38 L 77 22 C 77 20 80 20 80 22 L 88 42 C 84 46 16 46 12 42 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Crown Jewels / Spheres -->
    <circle cx="21" cy="20" r="3.8" fill="url(#goldGrad)" />
    <circle cx="50" cy="8" r="4.8" fill="url(#goldGrad)" />
    <circle cx="79" cy="20" r="3.8" fill="url(#goldGrad)" />
    <circle cx="11" cy="40" r="3" fill="url(#goldGrad)" />
    <circle cx="89" cy="40" r="3" fill="url(#goldGrad)" />

    <!-- Stylized Calligraphic 'M' -->
    <path d="M 18 88 C 28 66 40 50 56 46 C 72 42 78 52 74 64 C 70 76 60 88 52 98 C 66 84 76 68 84 56 C 92 44 98 48 95 62 C 90 82 82 102 96 112 C 104 118 116 114 122 106" 
          fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Loop accent -->
    <path d="M 24 92 C 14 100 12 110 24 112 C 40 114 58 98 70 82" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(145, 10)">
    <!-- Brand Title: MAHENDRA SINGH -->
    <text x="0" y="44" 
          font-family="'Montserrat', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="30" 
          font-weight="900" 
          letter-spacing="2.5" 
          fill="url(#goldGradLight)" 
          stroke="#553900" 
          stroke-width="0.8" 
          filter="url(#goldGlow)">MAHENDRA SINGH</text>

    <!-- Brand Sub-Title: ENTERPRISE with flank speed bars -->
    <g transform="translate(0, 68)">
      <polygon points="0,0 28,0 23,3 0,3" fill="url(#goldGrad)" />
      <polygon points="4,5 34,5 29,8 4,8" fill="url(#goldGrad)" />
      <polygon points="8,10 40,10 35,13 8,13" fill="url(#goldGrad)" />
    </g>

    <text x="50" y="78" 
          font-family="'Montserrat', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="22" 
          font-weight="800" 
          letter-spacing="4.5" 
          fill="url(#goldGrad)" 
          stroke="#442a00" 
          stroke-width="0.6">ENTERPRISE</text>

    <g transform="translate(250, 68)">
      <polygon points="12,0 40,0 40,3 17,3" fill="url(#goldGrad)" />
      <polygon points="6,5 36,5 36,8 11,8" fill="url(#goldGrad)" />
      <polygon points="0,10 32,10 32,13 5,13" fill="url(#goldGrad)" />
    </g>

    <!-- Divider Line -->
    <line x1="0" y1="94" x2="355" y2="94" stroke="url(#goldGradDark)" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="177" cy="94" r="2.5" fill="#fce484" />

    <!-- Tagline: MANPOWER SUPPLIER | CONTRACTOR & INDUSTRIAL SERVICES -->
    <text x="0" y="112" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="1.8" 
          fill="#e4e4e7">MANPOWER SUPPLIER</text>
    
    <text x="140" y="112" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="11" 
          font-weight="800" 
          fill="url(#goldGrad)">|</text>

    <text x="154" y="112" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="1.5" 
          fill="#fce484">CONTRACTOR &amp; INDUSTRIAL SERVICES</text>
  </g>
</svg>
